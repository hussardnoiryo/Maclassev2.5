<style>

details summary{cursor:pointer;font-weight:700;padding:6px 0}
pre.sql{background:#1e1e2e;color:#d6e0ff;border-radius:10px;padding:10px;font-size:.72rem;overflow:auto;max-height:320px;white-space:pre}

</style>

<body>
<div id="nav"></div>
<main id="main"></main>
<div id="toast"></div>
<div id="modal"><div id="mbox"></div></div>
<div id="sheet"><div id="sheetIn"></div></div>

<script>
/* =====================================================================
   Ma classe CE1 — appli unique. Un seul jeu de données (S), un seul CSV,
   une seule synchro Supabase. Rien n'est jamais écrasé sans confirmation.
   ===================================================================== */
const LS_KEY = "classe-ce1-v2", LS_CFG = "classe-ce1-v2-cloud", LS_PAGE = "classe-ce1-v2-page";
const MODS = { sons: "Sons", ecriture: "Écriture", vie: "Vie de classe", matos: "Matériel" };
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const today = () => new Date().toISOString().slice(0, 10);
const frDate = d => { const m = String(d).match(/^(\d{4})-(\d{2})-(\d{2})$/); return m ? `${m[3]}/${m[2]}/${m[1]}` : d; };
const fmt = n => (Math.round(n * 10) / 10).toString().replace(".", ",");
const norm = s => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().trim();
const mean = a => { a = a.filter(v => typeof v === "number" && !isNaN(v)); return a.length ? a.reduce((x, y) => x + y, 0) / a.length : null; };
const byName = (a, b) => a.name.localeCompare(b.name, "fr", { sensitivity: "base" });
const isDetail = name => /fran[cç]ais|math/i.test(name);
const isDetailCols = name => /fran[cç]ais|math|emc/i.test(name);   // colonnes du bilan Notes (EMC garde ses sous-matières automatiques)

/* ---------- Données ---------- */
function defaults() {
  const sub = n => ({ id: uid(), name: n });
  return {
    v: 2, updatedAt: null,
    students: [],
    subjects: [
      { id: uid(), name: "Français", subs: ["Lecture", "Écriture", "Orthographe", "Grammaire", "Vocabulaire"].map(sub) },
      { id: uid(), name: "Mathématiques", subs: ["Nombres", "Calcul", "Géométrie", "Grandeurs et mesures"].map(sub) },
      { id: uid(), name: "EMC", subs: ["Respect des consignes", "Respect des règles de vie"].map(sub) },
      { id: uid(), name: "Questionner le monde", subs: [] },
      { id: uid(), name: "Anglais", subs: [] },
      { id: uid(), name: "EPS", subs: [] },
      { id: uid(), name: "Arts", subs: [] }
    ],
    items: {
      sons: [], ecriture: [], matos: [],
      vie: [{ id: uid(), name: "Respect des consignes", emc: "consignes", w: 1 }, { id: uid(), name: "Respect des règles de vie", emc: "regles", w: 1 }]
    },
    counts: {},   // counts[élève][module][item] = cette semaine
    term: {},     // cumul des semaines précédentes (même forme)
    lent: {},     // lent["élève::item"] = true
    evals: []     // {id,date,subjectId,subId,label,max,grades{élève:note}}
  };
}
function load() {
  try {
    const d = JSON.parse(localStorage.getItem(LS_KEY));
    if (d && Array.isArray(d.students) && d.items) return fix(d);
  } catch (e) {}
  return defaults();
}
function fix(d) {
  const b = defaults();
  d.items = Object.assign({ sons: [], ecriture: [], vie: [], matos: [] }, d.items);
  ["counts", "term", "lent"].forEach(k => d[k] = d[k] || {});
  d.subjects = d.subjects || b.subjects; d.evals = d.evals || [];
  return d;
}
let S = load();
let cfg = (() => { try { return JSON.parse(localStorage.getItem(LS_CFG)) || {}; } catch (e) { return {}; } })();
let dirty = false;
function save(quiet) {
  S.updatedAt = new Date().toISOString();
  try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) { toast("⚠ Stockage du navigateur plein ou bloqué"); }
  if (!quiet) { dirty = true; schedulePush(); }
}
function toast(m) { const t = $("#toast"); t.textContent = m; t.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("on"), 2600); }
function modal(html) { $("#mbox").innerHTML = html; $("#modal").classList.add("on"); }
function closeModal() { $("#modal").classList.remove("on"); }
$("#modal").addEventListener("click", e => { if (e.target.id === "modal") closeModal(); });

const stud = id => S.students.find(s => s.id === id);
const subj = id => S.subjects.find(s => s.id === id);
const subOf = (sj, id) => sj && sj.subs.find(b => b.id === id);
const compOf = (sb, id) => sb && (sb.comps || []).find(c => c.id === id);
const cnt = (sid, mod, it) => ((S.counts[sid] || {})[mod] || {})[it] || 0;
const trm = (sid, mod, it) => ((S.term[sid] || {})[mod] || {})[it] || 0;
const tot = (sid, mod, it) => cnt(sid, mod, it) + trm(sid, mod, it);
const cumulMods = ["sons", "ecriture"];   // se cumulent sur tout le trimestre (pas de remise à zéro hebdomadaire)
function bump(sid, mod, it, d) {
  const c = ((S.counts[sid] = S.counts[sid] || {})[mod] = S.counts[sid][mod] || {});
  c[it] = Math.max(0, (c[it] || 0) + d);
}

/* ---------- Notes automatiques (calculées, jamais enregistrées) ----------
   écriture → Français › Écriture ; sons → Français › Orthographe ;
   lignes de vie de classe marquées « consignes » / « règles » → EMC.
   Barème relatif à la classe : 10/10 = aucune erreur, 3/10 = le plus d'erreurs de la classe (jamais en dessous de 3). */
let autoWarn = [];
function findSub(sjRe, subRe) {
  const sj = S.subjects.find(s => sjRe.test(norm(s.name))); const sb = sj && sj.subs.find(b => subRe.test(norm(b.name)));
  return sj && sb ? { sj, sb } : null;
}
function autoEvals() {
  autoWarn = [];
  const out = [];
  const specs = [
    { key: "ecriture", label: "Compteur d'écriture (automatique)", where: "Français › Écriture", t: findSub(/fran/, /ecriture/),
      val: sid => S.items.ecriture.reduce((a, it) => a + tot(sid, "ecriture", it.id), 0), has: S.items.ecriture.length },
    { key: "sons", label: "Compteur de sons (automatique)", where: "Français › Orthographe", t: findSub(/fran/, /orthographe/),
      val: sid => S.items.sons.reduce((a, it) => a + tot(sid, "sons", it.id), 0), has: S.items.sons.length },
    { key: "emc-consignes", label: "Respect des consignes (automatique)", where: "EMC › Respect des consignes", t: findSub(/emc|moral/, /consigne/),
      val: sid => S.items.vie.filter(i => i.emc === "consignes").reduce((a, it) => a + (it.w ?? 1) * tot(sid, "vie", it.id), 0), has: S.items.vie.some(i => i.emc === "consignes") },
    { key: "emc-regles", label: "Respect des règles de vie (automatique)", where: "EMC › Respect des règles de vie", t: findSub(/emc|moral/, /regle/),
      val: sid => S.items.vie.filter(i => i.emc === "regles").reduce((a, it) => a + (it.w ?? 1) * tot(sid, "vie", it.id), 0), has: S.items.vie.some(i => i.emc === "regles") }
  ];
  specs.forEach(sp => {
    if (!sp.has || !S.students.length) return;
    if (!sp.t) { autoWarn.push(sp.where); return; }
    const vals = {}; S.students.forEach(s => vals[s.id] = sp.val(s.id));
    const mx = Math.max(0, ...Object.values(vals)); if (mx === 0) return;
    const grades = {}; S.students.forEach(s => grades[s.id] = Math.round((3 + 7 * (1 - vals[s.id] / mx)) * 10) / 10);
    out.push({ id: "auto-" + sp.key, auto: true, date: today(), subjectId: sp.t.sj.id, subId: sp.t.sb.id, label: sp.label, max: 10, grades });
  });
  return out;
}
let _ae = null;
const allEvals = () => S.evals.concat(_ae || (_ae = autoEvals()));
const invalidate = () => { _ae = null; };

/* ---------- Moyennes ---------- */
const on10 = (v, m) => (typeof v === "number" && m) ? v / m * 10 : null;
function avgOf(sid, f) { return mean(allEvals().filter(f).map(e => on10(e.grades[sid], e.max))); }
function classAvg(f) { return mean(S.students.map(s => avgOf(s.id, f))); }
const cls = v => v === null ? "" : v >= 7.5 ? "g" : v >= 5 ? "o" : "r";
const pill = v => v === null ? `<span class="pill">–</span>` : `<span class="pill ${cls(v)}">${fmt(v)} / 10</span>`;
function columns() {   // colonnes du bilan : sous-matières pour maths/français, matière seule pour le reste
  const cols = [];
  S.subjects.forEach(sj => {
    if (!allEvals().some(e => e.subjectId === sj.id)) return;

function detailTree(sid) {

const SQL = `-- À coller dans Supabase › SQL Editor › Run (une seule fois)
create table if not exists public.classe_data (
  code text primary key check (length(code) >= 8),
  data jsonb not null,
  rev integer not null default 1,
  updated_at timestamptz not null default now()
);
create table if not exists public.classe_history (
  id bigserial primary key,
  code text not null,
  data jsonb not null,
  rev integer not null,
  saved_at timestamptz not null default now()
);
-- Sécurité : aucune lecture/écriture directe, uniquement via les 2 fonctions ci-dessous
alter table public.classe_data enable row level security;
alter table public.classe_history enable row level security;

create or replace function public.classe_get(p_code text) returns jsonb
language sql security definer set search_path = public as $$
  select jsonb_build_object('rev', rev, 'data', data, 'updated_at', updated_at)
  from public.classe_data where code = p_code and length(p_code) >= 8;
$$;

create or replace function public.classe_put(p_code text, p_data jsonb, p_base integer, p_force boolean default false)
returns integer language plpgsql security definer set search_path = public as $$
declare cur integer; old jsonb;
begin
  if length(p_code) < 8 then raise exception 'code trop court'; end if;
  select rev, data into cur, old from public.classe_data where code = p_code for update;
  if not found then
    insert into public.classe_data(code, data, rev) values (p_code, p_data, 1);
    return 1;
  end if;
  if not p_force and cur <> p_base then return -1; end if;  -- conflit : rien n'est écrasé
  insert into public.classe_history(code, data, rev) values (p_code, old, cur);  -- ancienne version gardée
  delete from public.classe_history where code = p_code and id not in
    (select id from public.classe_history where code = p_code order by id desc limit 30);
  update public.classe_data set data = p_data, rev = cur + 1, updated_at = now() where code = p_code;
  return cur + 1;
end $$;

revoke all on function public.classe_get(text) from public;
revoke all on function public.classe_put(text, jsonb, integer, boolean) from public;
grant execute on function public.classe_get(text) to anon, authenticated;
grant execute on function public.classe_put(text, jsonb, integer, boolean) to anon, authenticated;`;

async function rpc(fn, body) {

  try {
    setSync("☁️ envoi…");
    const rev = await rpc("classe_put", { p_code: cfg.code, p_data: S, p_base: cfg.rev || 0, p_force: !!force });
    if (rev === -1) { setSync("⚠ conflit", true); return conflict(); }
    cfg.rev = rev; saveCfg(); dirty = false; setSync("☁️ à jour");
  } catch (e) { setSync("⚠ hors ligne / erreur", true); console.warn(e); }
}
async function pull(manual) {
  if (!cloudOn()) return;
  try {
    setSync("☁️ lecture…");
    const r = await rpc("classe_get", { p_code: cfg.code });
    if (!r) { await push(false); if (manual) toast("Cloud vide : tes données y ont été envoyées ✓"); return; }
    if (r.rev === cfg.rev && !manual) { setSync("☁️ à jour"); if (dirty) push(false); return; }
    if (dirty && r.rev !== cfg.rev) return conflict(r);
    adopt(r); if (manual) toast("Données du cloud chargées ✓");
  } catch (e) { setSync("⚠ hors ligne / erreur", true); console.warn(e); if (manual) toast("Synchro impossible : " + e.message); }
}
function adopt(r) { S = fix(r.data); cfg.rev = r.rev; saveCfg(); save(true); dirty = false; setSync("☁️ à jour"); render(); }
async function conflict(r) {
  try { r = r || await rpc("classe_get", { p_code: cfg.code }); } catch (e) { return; }
  const n = d => `${(d.students || []).length} élève(s), ${(d.evals || []).length} évaluation(s)`;
  modal(`<h2>⚠ Deux versions différentes</h2><p class="muted">Les données ont changé ailleurs (autre appareil) pendant que tu modifiais celles-ci. Rien n'a été écrasé. Que veux-tu garder ?</p>
    <p style="margin:10px 0"><b>Cet appareil :</b> ${n(S)}<br><b>Cloud :</b> ${n(r.data)}${r.updated_at ? " (modifié le " + new Date(r.updated_at).toLocaleString("fr-FR") + ")" : ""}</p>
    <div class="row"><button class="btn pri" id="cf-cloud">Garder la version du cloud</button><button class="btn dan" id="cf-mine">Garder celle-ci (remplace le cloud)</button></div>
    <p class="muted" style="margin-top:8px">Dans les deux cas, une sauvegarde de la version abandonnée est téléchargée, et le cloud garde ses 30 dernières versions.</p>`);
  $("#cf-cloud").onclick = () => { download("sauvegarde-appareil-" + today() + ".json", JSON.stringify(S, null, 2)); adopt(r); closeModal(); toast("Version du cloud chargée ✓"); };
  $("#cf-mine").onclick = async () => { download("sauvegarde-cloud-" + today() + ".json", JSON.stringify(r.data, null, 2)); cfg.rev = r.rev; saveCfg(); closeModal(); await push(true); toast("Cloud remplacé ✓"); };
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) pull(false); });
setInterval(() => { if (!document.hidden && !dirty) pull(false); }, 60000);

/* ===================== Export / import ===================== */
function download(name, text, type) {
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], { type: type || "application/json" }));
  a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 800);
}
function exportCsv() {
  const q = v => { v = String(v ?? ""); return /[;"\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  const line = a => a.map(q).join(";"), num = v => v === null ? "" : String(Math.round(v * 100) / 100).replace(".", ",");
  const out = [], sorted = [...S.students].sort(byName), cols = columns();
  out.push(line(["BILAN PAR ÉLÈVE (cumul : semaines précédentes + semaine en cours)"]));
  const head = ["Élève", ...cols.map(c => c.label + " (/10)"), "Moyenne générale (/10)"];
  const mc = []; ["vie", "sons", "ecriture", "matos"].forEach(m => S.items[m].forEach(it => mc.push({ m, it })));
  out.push(line([...head, ...mc.map(x => MODS[x.m] + " — " + x.it.name)]));
  sorted.forEach(s => out.push(line([s.name, ...cols.map(c => num(avgOf(s.id, c.f))), num(avgOf(s.id, () => true)), ...mc.map(x => tot(s.id, x.m, x.it.id))])));
  out.push(line(["Moyenne de la classe", ...cols.map(c => num(classAvg(c.f))), num(classAvg(() => true))]));
  out.push(""); out.push(line(["DÉTAIL DES ÉVALUATIONS (notes brutes ; « automatique » = calculée depuis les compteurs)"]));
  out.push(line(["Date", "Matière", "Sous-matière", "Compétence", "Intitulé", "Barème", "Automatique", ...sorted.map(s => s.name)]));
  [...allEvals()].sort((a, b) => a.date.localeCompare(b.date)).forEach(e => { const sj = subj(e.subjectId); out.push(line([frDate(e.date), sj ? sj.name : "", (subOf(sj, e.subId) || {}).name || "", (compOf(subOf(sj, e.subId), e.compId) || {}).name || "", e.label, e.max, e.auto ? "oui" : "", ...sorted.map(s => typeof e.grades[s.id] === "number" ? String(e.grades[s.id]).replace(".", ",") : "")])); });
  out.push(""); out.push(line(["MATÉRIEL ACTUELLEMENT PRÊTÉ"]));
  Object.keys(S.lent).filter(k => S.lent[k]).forEach(k => { const [sid, iid] = k.split("::"); const st = stud(sid), it = S.items.matos.find(i => i.id === iid); if (st && it) out.push(line([st.name, it.name])); });
  download("classe-ce1-" + today() + ".csv", "﻿" + out.join("\r\n"), "text/csv;charset=utf-8");
}

/* ===================== Actions ===================== */
function addStudents(names) {
  let n = 0; names.forEach(x => { x = x.trim(); if (x && !S.students.some(s => norm(s.name) === norm(x))) { S.students.push({ id: uid(), name: x }); n++; } });
  if (n) { save(); render(); } return n;
}
function inferEmc(name) { const n = norm(name); return /consigne/.test(n) ? "consignes" : /regle/.test(n) ? "regles" : ""; }
function evalFromDraft() {
  const grades = {}; Object.keys(draft.grades).forEach(k => { const v = draft.grades[k]; if (typeof v === "number" && stud(k)) grades[k] = v; });
  return { id: draft.editId || uid(), date: draft.date || today(), subjectId: draft.subjectId, subId: draft.subId, compId: draft.compId || "", label: (draft.label || "").trim(), max: +draft.max || 10, grades };
}
const actions = {
  print() { printMode = ""; buildSheet(); window.print(); },
  parents() {
    if (!S.students.length) return toast("Ajoute d'abord des élèves");
    if (!S.items.vie.length) return toast("Ajoute d'abord des lignes de vie de classe");
    printMode = "parents"; buildSheet(); window.print();
  },
  clearDraft() { draft = { subjectId: draft.subjectId, subId: "", compId: "", label: "", date: today(), max: 10, grades: {}, editId: null }; saveDraft(); render(); },
  saveEval() {
    const e = evalFromDraft();
    if (!e.subjectId) return toast("Choisis une matière");
    if (!Object.keys(e.grades).length) return toast("Saisis au moins une note");
    const over = Object.keys(e.grades).find(k => e.grades[k] > e.max); if (over) return toast("Note supérieure au barème : " + stud(over).name);
    const i = S.evals.findIndex(x => x.id === e.id); if (i >= 0) S.evals[i] = e; else S.evals.push(e);
    save(); actions.clearDraft(); toast("Évaluation enregistrée ✓");
  },
  newWeek() {
    if (!confirm("Fin de semaine : les compteurs de VIE DE CLASSE et de MATÉRIEL de la semaine sont ajoutés au cumul du trimestre, puis remis à zéro.\n\n(Les compteurs de sons et d'écriture ne sont pas touchés : ils se cumulent sur tout le trimestre.)\n\nContinuer ?")) return;
    Object.keys(S.counts).forEach(sid => ["vie", "matos"].forEach(m => {
      const w = (S.counts[sid] || {})[m]; if (!w) return;
      const t = ((S.term[sid] = S.term[sid] || {})[m] = S.term[sid][m] || {});
      Object.keys(w).forEach(it => { t[it] = (t[it] || 0) + w[it]; });
      S.counts[sid][m] = {};
    }));
    save(); render(); toast("Semaine archivée — vie de classe et matériel remis à zéro ✓");
  },
  newTerm() {
    if (!confirm("NOUVEAU TRIMESTRE\n\n• Une sauvegarde complète (JSON) est téléchargée d'abord.\n• Évaluations, compteurs, cumul et prêts sont remis à zéro.\n• Élèves, matières et lignes de compteurs sont conservés.\n\nContinuer ?")) return;
    download("sauvegarde-fin-trimestre-" + today() + ".json", JSON.stringify(S, null, 2));
    exportCsv();
    setTimeout(() => { S.evals = []; S.counts = {}; S.term = {}; S.lent = {}; draft = { subjectId: "", subId: "", compId: "", label: "", date: today(), max: 10, grades: {}, editId: null }; saveDraft(); save(); render(); toast("Nouveau trimestre prêt ✓"); }, 900);
  },
  csv() { exportCsv(); },
  json() { download("classe-ce1-" + today() + ".json", JSON.stringify(S, null, 2)); },
  import() { $("#imp").click(); },
  copySql() { (navigator.clipboard ? navigator.clipboard.writeText(SQL) : Promise.reject()).then(() => toast("Script copié ✓"), () => { const p = document.querySelector("pre.sql"); const r = document.createRange(); r.selectNodeContents(p); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast("Sélectionné : copie avec Ctrl+C"); }); },
  async cfgSave() {
    cfg = { url: $("#c-url").value.trim(), key: $("#c-key").value.trim(), code: $("#c-code").value.trim(), rev: cfg.code === $("#c-code").value.trim() ? cfg.rev : 0 };
    if (!cfg.url || !cfg.key) return toast("URL et clé requises");
    if (cfg.code.length < 8) return toast("Le code doit faire 8 caractères minimum");
    saveCfg();
    try {
      const r = await rpc("classe_get", { p_code: cfg.code });
      if (!r) { await push(false); toast("Cloud initialisé avec tes données ✓"); }
      else if (!S.students.length && !S.evals.length) { adopt(r); toast("Données du cloud chargées ✓"); }
      else { cfg.rev = cfg.rev || 0; dirty = true; conflict(r); }
    } catch (e) { setSync("⚠ erreur", true); toast("Connexion impossible : " + e.message); }
    render();
  },
  pull() { pull(true); },
  cfgOff() { cfg = {}; saveCfg(); render(); toast("Synchronisation désactivée"); }
};

/* ---------- Événements ---------- */
document.addEventListener("click", ev => {
  const t = ev.target.closest("[data-go],[data-cat],[data-cv],[data-nav],[data-dec2],[data-decm2],[data-inc],[data-dec],[data-decm],[data-lend],[data-lend2],[data-inc2],[data-tbl],[data-nt],[data-edit],[data-deval],[data-an],[data-act],[data-ds],[data-di],[data-dsj],[data-dsb],[data-add],[data-addsb],[data-addcp],[data-dcp]");
  if (!t) return; const d = t.dataset;
  if (d.go) return go(d.go);
  if (d.cat) { ccat.vie = d.cat; return render(); }
  if (d.cv) { cview[page] = d.cv; return render(); }
  if (d.nav) { const [m, k] = d.nav.split("|"), so = [...S.students].sort(byName), i = so.findIndex(s => s.id === sel[m]); sel[m] = so[(i + (+k) + so.length) % so.length].id; return render(); }
  if (d.dec2) { ev.stopPropagation(); const [m, s, it] = d.dec2.split("|"); bump(s, m, it, -1); save(); return render(); }
  if (d.decm2) { const [s, it] = d.decm2.split("|"); if (S.lent[s + "::" + it]) delete S.lent[s + "::" + it]; bump(s, "matos", it, -1); save(); return render(); }
  if (d.dec) { ev.stopPropagation(); const [m, it] = d.dec.split("|"); bump(sel[m], m, it, -1); save(); return render(); }
  if (d.inc) { const [m, it] = d.inc.split("|"); bump(sel[m], m, it, 1); save(); return render(); }
  if (d.inc2) { const [m, s, it] = d.inc2.split("|"); bump(s, m, it, 1); save(); return render(); }
  if (d.decm) { const k = sel.matos + "::" + d.decm; if (S.lent[k]) delete S.lent[k]; bump(sel.matos, "matos", d.decm, -1); save(); return render(); }
  if (d.lend) { const k = sel.matos + "::" + d.lend; if (S.lent[k]) delete S.lent[k]; else { S.lent[k] = true; bump(sel.matos, "matos", d.lend, 1); } save(); return render(); }
  if (d.lend2) { const [s, it] = d.lend2.split("|"), k = s + "::" + it; if (S.lent[k]) delete S.lent[k]; else { S.lent[k] = true; bump(s, "matos", it, 1); } save(); return render(); }
  if (d.nt) { ntab = d.nt; return render(); }
  if (d.an) { anSel = d.an; return render(); }
  if (d.edit) { const e = S.evals.find(x => x.id === d.edit); if (e) { draft = { subjectId: e.subjectId, subId: e.subId, compId: e.compId || "", label: e.label, date: e.date, max: e.max, grades: { ...e.grades }, editId: e.id }; saveDraft(); ntab = "saisie"; render(); } return; }
  if (d.deval) { if (confirm("Supprimer cette évaluation ?")) { S.evals = S.evals.filter(x => x.id !== d.deval); save(); render(); } return; }
  if (d.act) return actions[d.act]();
  if (d.ds) { const s = stud(d.ds); if (!confirm(`Supprimer ${s.name} ? Ses notes et compteurs seront supprimés.`)) return;
    S.students = S.students.filter(x => x.id !== d.ds); delete S.counts[d.ds]; delete S.term[d.ds]; Object.keys(S.lent).forEach(k => { if (k.startsWith(d.ds + "::")) delete S.lent[k]; });
    S.evals.forEach(e => delete e.grades[d.ds]); save(); return render(); }
  if (d.di) { const [m, id] = d.di.split("|"); if (!confirm("Supprimer cette ligne et ses compteurs ?")) return;
    S.items[m] = S.items[m].filter(i => i.id !== id);
    [S.counts, S.term].forEach(o => Object.keys(o).forEach(s => o[s][m] && delete o[s][m][id]));
    Object.keys(S.lent).forEach(k => { if (k.endsWith("::" + id)) delete S.lent[k]; }); save(); return render(); }
  if (d.dsj) { if (!confirm("Supprimer cette matière ? Ses évaluations seront supprimées.")) return; S.subjects = S.subjects.filter(x => x.id !== d.dsj); S.evals = S.evals.filter(e => e.subjectId !== d.dsj); save(); return render(); }
  if (d.dsb) { const [a, b] = d.dsb.split("|"); if (!confirm("Supprimer cette sous-matière ? Ses évaluations seront rattachées à la matière seule.")) return; const sj = subj(a); sj.subs = sj.subs.filter(x => x.id !== b); S.evals.forEach(e => { if (e.subId === b) e.subId = ""; }); save(); return render(); }
  if (d.addcp) { const [a, b] = d.addcp.split("|"), sb = subOf(subj(a), b), i = $("#add-cp-" + b), v = i.value.trim(); if (!v) return; (sb.comps = sb.comps || []).push({ id: uid(), name: v }); save(); return render(); }
  if (d.dcp) { const [a, b, c] = d.dcp.split("|"); if (!confirm("Supprimer cette compétence ? Les évaluations gardent leur intitulé.")) return; const sb = subOf(subj(a), b); sb.comps = sb.comps.filter(x => x.id !== c); S.evals.forEach(e => { if (e.compId === c) e.compId = ""; }); save(); return render(); }
  if (d.addsb) { const i = $("#add-sb-" + d.addsb), v = i.value.trim(); if (!v) return; subj(d.addsb).subs.push({ id: uid(), name: v }); save(); return render(); }
  if (d.add) {
    if (d.add === "bulk") { const n = addStudents($("#bulk").value.split("\n")); return toast(n + " élève(s) ajouté(s)"); }
    const i = $("#add-" + d.add), v = i.value.trim(); if (!v) return;
    if (d.add === "student") { if (!addStudents([v])) toast("Déjà dans la liste"); return; }
    if (d.add === "subject") S.subjects.push({ id: uid(), name: v, subs: [] });
    else S.items[d.add].push(d.add === "vie" ? { id: uid(), name: v, emc: inferEmc(v), w: 1 } : { id: uid(), name: v });
    save(); render(); setTimeout(() => { const n = $("#add-" + d.add); n && n.focus(); }, 30);
  }
});
document.addEventListener("change", ev => {
  const t = ev.target, d = t.dataset;
  if (d.selst) { sel[d.selst] = t.value; return render(); }
  if (d.selit) { citem[d.selit] = t.value; return render(); }
  if (d.d) { draft[d.d] = d.d === "max" ? (+t.value || 10) : t.value; if (d.d === "subjectId") { draft.subId = ""; draft.compId = ""; } if (d.d === "subId") draft.compId = ""; saveDraft(); if (["subjectId", "subId", "max"].includes(d.d)) render(); return; }
  if (d.g) { const v = t.value.replace(",", "."); if (v === "") delete draft.grades[d.g]; else draft.grades[d.g] = parseFloat(v); saveDraft(); const p = $("#gp-" + d.g); if (p) p.innerHTML = pill(on10(draft.grades[d.g], draft.max)); updDraftMean(); return; }
  if (d.hf !== undefined) { histF = t.value; return render(); }
  if (d.rn) { const s = stud(d.rn), v = t.value.trim(); if (v) { s.name = v; save(); } return render(); }
  if (d.ri) { const [m, id] = d.ri.split("|"), it = S.items[m].find(i => i.id === id), v = t.value.trim(); if (v) { it.name = v; if (m === "vie" && !it.emc) it.emc = inferEmc(v); save(); } return render(); }
  if (d.emc) { S.items.vie.find(i => i.id === d.emc).emc = t.value; save(); return; }
  if (d.w) { S.items.vie.find(i => i.id === d.w).w = Math.max(0, parseFloat(t.value) || 0); save(); return; }
  if (d.rsj) { const v = t.value.trim(); if (v) { subj(d.rsj).name = v; save(); } return render(); }
  if (d.rcp) { const [a, b, c] = d.rcp.split("|"), v = t.value.trim(); if (v) { compOf(subOf(subj(a), b), c).name = v; save(); } return render(); }
  if (d.rsb) { const [a, b] = d.rsb.split("|"), v = t.value.trim(); if (v) { subOf(subj(a), b).name = v; save(); } return render(); }
  if (t.id === "imp") {
    const f = t.files[0]; if (!f) return;
    const r = new FileReader(); r.onload = () => {
      try {
        const d2 = JSON.parse(r.result); if (!d2 || !Array.isArray(d2.students) || !d2.items) throw 0;
        if (!confirm("Importer cette sauvegarde ? Elle remplace les données actuelles (une copie de sécurité des données actuelles est téléchargée).")) return;
        download("avant-import-" + today() + ".json", JSON.stringify(S, null, 2));
        S = fix(d2); save(); render(); toast("Sauvegarde importée ✓");
      } catch (e) { toast("Fichier non reconnu"); }
    }; r.readAsText(f); t.value = "";
  }
});
document.addEventListener("input", ev => {
  const g = ev.target.dataset.g; if (g === undefined) return;
  const v = ev.target.value.replace(",", "."); if (v === "") delete draft.grades[g]; else draft.grades[g] = parseFloat(v);
  const p = $("#gp-" + g); if (p) p.innerHTML = pill(on10(draft.grades[g], draft.max)); updDraftMean();
});

render(); updDraftMean();
if (cloudOn()) pull(false);
</script>
